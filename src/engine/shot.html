<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Motion Studio v2 Shot Renderer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d16;
      color: #f8fafc;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      transform-style: preserve-3d;
      background: radial-gradient(circle at 25% 20%, #1e293b 0%, #090d16 72%);
    }
    .layer {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      will-change: transform, filter;
      pointer-events: none;
    }
    .grid-orb {
      position: absolute;
      width: 58vmin;
      height: 58vmin;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.42), rgba(99, 102, 241, 0.12) 65%, transparent 75%);
      top: 14%;
      right: 8%;
    }
    .grid-orb-2 {
      position: absolute;
      width: 68vmin;
      height: 68vmin;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.40), rgba(139, 92, 246, 0.18) 55%, transparent 72%);
      bottom: 8%;
      left: 2%;
    }
    .accent-card {
      position: absolute;
      inset: 14% 10% 22% 10%;
      border-radius: 28px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.86), rgba(30, 41, 59, 0.72));
      box-shadow: 0 28px 70px rgba(2, 6, 23, 0.65);
    }
    body.landscape .accent-card {
      inset: 12% 10% 14% 10%;
    }
    .fg-content {
      position: absolute;
      inset: 24% 16% 28% 16%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
    }
    body.landscape .fg-content {
      inset: 16% 14% 18% 14%;
      gap: 22px;
    }
    .kicker {
      display: inline-block;
      align-self: flex-start;
      padding: 8px 18px;
      border-radius: 999px;
      background: #0369a1;
      color: #ffffff;
      font-weight: 700;
      font-size: clamp(18px, 2.2vmin, 26px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .headline {
      color: #f8fafc;
      background-color: #0f172a;
      padding: 12px 18px;
      border-radius: 14px;
      font-weight: 800;
      line-height: 1.12;
      font-size: clamp(40px, 5.6vmin, 84px);
      max-width: 100%;
      overflow-wrap: break-word;
    }
    .sub {
      color: #e2e8f0;
      background-color: #0f172a;
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 500;
      line-height: 1.38;
      font-size: clamp(22px, 3.0vmin, 38px);
      max-width: 94%;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="layer-bg" class="layer">
      <div class="grid-orb"></div>
      <div class="grid-orb-2"></div>
    </div>
    <div id="layer-mid" class="layer">
      <div class="accent-card"></div>
    </div>
    <div id="layer-fg" class="layer">
      <div class="fg-content">
        <div id="slot-kicker" data-slot="kicker" class="kicker hidden"></div>
        <h1 id="slot-headline" data-slot="headline" class="headline"></h1>
        <p id="slot-sub" data-slot="sub" class="sub hidden"></p>
      </div>
    </div>
  </div>

  <script src="./camera.js"></script>
  <script>
    window.ready = false;
    let ACTIVE_SHOT = {
      id: "SH01",
      duration: 2.0,
      look: "parallax_cards",
      seed: 42,
      camera: { move: "dolly_in", lens_mm: 35, aperture: 2.8, focus: "fg", speed: "ease_in_out" },
      slots: { headline: "Motion Studio v2", sub: "Deterministic camera engine" }
    };

    function applyShotData(shot) {
      ACTIVE_SHOT = Object.assign({}, ACTIVE_SHOT, shot || {});
      const isLandscape = window.innerWidth > window.innerHeight;
      document.body.classList.toggle("landscape", isLandscape);
      document.body.dataset.look = ACTIVE_SHOT.look || "parallax_cards";

      const slots = ACTIVE_SHOT.slots || {};
      const map = [
        ["slot-kicker", slots.kicker || ""],
        ["slot-headline", slots.headline || ""],
        ["slot-sub", slots.sub || ""]
      ];
      for (const [elId, text] of map) {
        const el = document.getElementById(elId);
        if (!el) continue;
        el.textContent = text;
        el.classList.toggle("hidden", text.trim().length === 0 && elId !== "slot-headline");
      }
    }

    window.loadShot = async function loadShot(shot) {
      applyShotData(shot);
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }
      window.seek(0, ACTIVE_SHOT.duration || 2.0);
      window.ready = true;
    };

    window.seek = function seek(t, duration) {
      const dur = Math.max(0.001, Number(duration || ACTIVE_SHOT.duration || 2.0));
      const p = Math.max(0, Math.min(1, Number(t) / dur));
      const cam = window.computeCameraFrame(
        ACTIVE_SHOT.camera || {},
        p,
        window.innerWidth || 1080,
        ACTIVE_SHOT.seed || 42
      );

      const stage = document.getElementById("stage");
      stage.style.perspective = `${cam.perspectivePx}px`;

      for (const layerName of ["bg", "mid", "fg"]) {
        const node = document.getElementById(`layer-${layerName}`);
        const st = cam.layers[layerName];
        if (!node || !st) continue;
        node.style.transform = st.transform;
        node.style.filter = st.blurPx > 0.05 ? `blur(${st.blurPx}px)` : "none";
      }

      const headline = document.getElementById("slot-headline");
      const sub = document.getElementById("slot-sub");
      const headReveal = Math.min(1, p / 0.22);
      const subReveal = Math.max(0, Math.min(1, (p - 0.14) / 0.24));
      headline.style.opacity = String((0.25 + 0.75 * headReveal).toFixed(3));
      sub.style.opacity = String(subReveal.toFixed(3));
    };

    window.measure = function measure() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const nodes = Array.from(document.querySelectorAll("[data-slot]")).filter(
        (el) => !el.classList.contains("hidden") && el.textContent.trim().length > 0
      );
      const items = nodes.map((el) => {
        const r = el.getBoundingClientRect();
        const cs = window.getComputedStyle(el);
        return {
          slot: el.dataset.slot,
          text: el.textContent,
          left: r.left,
          top: r.top,
          right: r.right,
          bottom: r.bottom,
          width: r.width,
          height: r.height,
          color: cs.color,
          backgroundColor: cs.backgroundColor
        };
      });
      return { viewport: { width: vw, height: vh }, items };
    };

    (async () => {
      const params = new URLSearchParams(window.location.search);
      const raw = params.get("shot");
      if (raw) {
        try {
          await window.loadShot(JSON.parse(raw));
          return;
        } catch (_err) {
          // Fall back to default shot payload if query string is malformed
        }
      }
      await window.loadShot(ACTIVE_SHOT);
    })();
  </script>
</body>
</html>
