<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src data:;"
  />
  <title>Motion Studio v2 — Universal Generative Scene Host</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070d;
      color: #f8fafc;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    #camera-rig {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      transform-style: preserve-3d;
    }
    #camera-plane {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      will-change: transform, filter;
    }
    #scene-canvas {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
  <style id="ai-custom-css"></style>
</head>
<body>
  <div id="camera-rig">
    <div id="camera-plane">
      <div id="scene-canvas"></div>
    </div>
  </div>

  <script src="./camera.js"></script>
  <script>
    window.ready = false;
    window.lastRuntimeError = null;
    let ACTIVE_SHOT = null;
    let COMPILED_SEEK_FN = null;

    function createSeededRng(seed) {
      let a = (seed >>> 0) || 1337;
      return function rng() {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    window.mountGenerativeShot = async function mountGenerativeShot(shot) {
      window.ready = false;
      window.lastRuntimeError = null;
      ACTIVE_SHOT = shot;

      const isPortrait = window.innerHeight > window.innerWidth;
      document.body.classList.toggle("portrait", isPortrait);
      document.body.classList.toggle("landscape", !isPortrait);

      const styleEl = document.getElementById("ai-custom-css");
      const canvasEl = document.getElementById("scene-canvas");
      styleEl.textContent = shot.css_styles || "";
      canvasEl.innerHTML = shot.html_markup || "";

      try {
        COMPILED_SEEK_FN = new Function(
          "t",
          "duration",
          "progress",
          "rng",
          "isPortrait",
          shot.seek_js_body
        );
      } catch (err) {
        window.lastRuntimeError = `CompileError: ${err && err.message ? err.message : String(err)}`;
        throw err;
      }

      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }

      window.seek(0, shot.duration || 3.0);
      window.ready = true;
    };

    window.seek = function seek(t, duration) {
      if (!ACTIVE_SHOT || !COMPILED_SEEK_FN) return;
      const dur = Math.max(0.001, Number(duration || ACTIVE_SHOT.duration || 3.0));
      const ts = Math.max(0, Math.min(dur, Number(t)));
      const progress = Math.max(0, Math.min(1, ts / dur));
      const isPortrait = window.innerHeight > window.innerWidth;

      // 1. Apply Higgsfield virtual 3D camera rig transform
      if (typeof window.computeCameraFrame === "function") {
        const cam = window.computeCameraFrame(
          ACTIVE_SHOT.camera || {},
          progress,
          window.innerWidth || 1920,
          ACTIVE_SHOT.seed || 1337
        );
        const rig = document.getElementById("camera-rig");
        const plane = document.getElementById("camera-plane");
        rig.style.perspective = `${cam.perspectivePx}px`;
        const fg = cam.layers && cam.layers.fg ? cam.layers.fg : null;
        if (fg) {
          plane.style.transform = fg.transform;
          plane.style.filter = fg.blurPx > 0.05 ? `blur(${fg.blurPx}px)` : "none";
        }
      }

      // 2. Execute AI-authored deterministic scene choreography
      const rng = createSeededRng((ACTIVE_SHOT.seed || 1337) + Math.round(ts * 1000));
      try {
        COMPILED_SEEK_FN(ts, dur, progress, rng, isPortrait);
      } catch (err) {
        window.lastRuntimeError = `SeekRuntimeError @ t=${ts.toFixed(3)}s: ${
          err && err.message ? err.message : String(err)
        }`;
        throw err;
      }
    };

    window.inspectScene = function inspectScene() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const root = document.getElementById("scene-canvas");
      const textElements = [];
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT);
      let node = walker.nextNode();
      while (node) {
        const directText = Array.from(node.childNodes)
          .filter((n) => n.nodeType === Node.TEXT_NODE)
          .map((n) => n.textContent.trim())
          .join(" ")
          .trim();
        if (directText.length > 0) {
          const r = node.getBoundingClientRect();
          const cs = window.getComputedStyle(node);
          if (r.width > 0 && r.height > 0 && cs.visibility !== "hidden" && cs.display !== "none") {
            textElements.push({
              tag: node.tagName.toLowerCase(),
              id: node.id || "",
              text: directText.slice(0, 80),
              left: r.left,
              top: r.top,
              right: r.right,
              bottom: r.bottom,
              width: r.width,
              height: r.height,
            });
          }
        }
        node = walker.nextNode();
      }
      return {
        viewport: { width: vw, height: vh },
        childElementCount: root.querySelectorAll("*").length,
        hasCanvas: root.querySelector("canvas") !== null,
        hasSvg: root.querySelector("svg") !== null,
        textElements,
        lastRuntimeError: window.lastRuntimeError,
      };
    };
  </script>
</body>
</html>
